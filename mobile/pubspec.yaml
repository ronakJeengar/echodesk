name: echodesk_mobile
description: "EchoDesk - AI Voice Agent & Field Operations CRM Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  go_router: ^14.2.0
  equatable: ^2.0.5

  # Networking & Real-Time WebSockets
  dio: ^5.5.0+1
  socket_io_client: ^3.0.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Audio Recording & Playback
  record: ^5.1.2
  audioplayers: ^6.0.0

  # PDF Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Serialization & Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

dependency_overrides:
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: echodesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: echodesk_user
      POSTGRES_PASSWORD: echodesk_password
      POSTGRES_DB: echodesk
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U echodesk_user -d echodesk']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: echodesk-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echodesk-backend
    restart: unless-stopped
    ports:
      - '5001:5001'
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://echodesk_user:echodesk_password@postgres:5432/echodesk?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: echodesk_super_secret_jwt_key_for_production_2026!
      STT_PROVIDER: mock
      LLM_PROVIDER: mock
      STORAGE_DRIVER: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echodesk-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
